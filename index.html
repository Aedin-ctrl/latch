<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latch</title>
<meta name="description" content="The light holds for ten seconds, and so does everything you did in the last ten. An 8-bit puzzle about cooperating with recordings of yourself.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070c'/%3E%3Crect x='5' y='8' width='5' height='16' fill='%2345c882'/%3E%3Crect x='22' y='8' width='5' height='16' fill='%2345c882'/%3E%3Cpath d='M11 16h10' stroke='%23b2e9e2' stroke-width='2'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#05070c;overflow:hidden;}
  /* a column, so the instruction line has its own room and can never print over the game */
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
       font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5d6a74;
       touch-action:none;-webkit-user-select:none;user-select:none;}
  canvas{
    display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#000;
    box-shadow:0 0 0 1px #1a2129, 0 24px 60px -30px #000;
  }
  .hint{margin:0;flex:none;padding:0 10px;text-align:center;font-size:11px;letter-spacing:.06em;}
  @media (prefers-reduced-motion:reduce){.hint{opacity:.7;}}
  noscript{color:#aeaeae;text-align:center;max-width:40ch;}
</style>
</head>
<body>
<canvas id="screen" width="256" height="240" aria-label="Latch, an 8-bit puzzle. Arrow keys move, q abandons the current discharge, r restarts the room."></canvas>
<p class="hint">arrows move &middot; q abandons the discharge &middot; r restarts the room &middot; m mutes</p>
<noscript>Latch needs JavaScript — the whole game, including every pixel and every sound, is generated at runtime.</noscript>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
